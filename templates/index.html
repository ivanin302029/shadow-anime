<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Anime</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #11141a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px;">
    <h1 style="color: #ff4757; font-size: 42px;">SHADOW<span>ANIME</span></h1>
    <p>Votre plateforme est officiellement en ligne !</p>
    <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin-left: auto; margin-right: auto;">
        {% for anime in animes %}
        <a href="/video/{{ anime.id }}" style="text-decoration: none; color: white; background: #1e222b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <img src="{{ anime.image }}" style="width: 100%; border-radius: 6px; aspect-ratio: 2/3; object-fit: cover;">
            <h3>{{ anime.titre }}</h3>
            <p style="color: #1e90ff;">{{ anime.genres|join(', ') }}</p>
        </a>
        {% endfor %}
    </div>
</body>
</html>
